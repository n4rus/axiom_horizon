[package]
name = "kai-standalone"
version = "0.1.0"
edition = "2021"
description = "Standalone Kai AGI runner — ingests the live checkpoint and runs the world-model / attractor / VFE loop in pure Rust (Rust MLIR kernels)."
license = "MIT"

[dependencies]
kai-core = { path = "../kai-core" }
kai-mlir = { path = "../kai-mlir" }
physics-dialect = { path = "../physics-dialect" }
ndarray = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2", features = ["json"] }
