[package]
name = "kai-fusion"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kai"
path = "src/main.rs"

[features]
gpu = []

[dependencies]
memmap2 = "0.9"
ndarray = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rand = "0.8"
kai-mlir = { path = "../kai-mlir" }
ureq = "2"
rayon = "1.10"
rusqlite = { version = "0.31", features = ["bundled", "serde_json"] }
syn = { version = "2", features = ["full", "extra-traits", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
image = "0.24"
glob = "0.3"
