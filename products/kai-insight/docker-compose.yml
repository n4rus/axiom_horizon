version: '3.8'

services:
  kai-insight:
    build:
      context: ../..
      dockerfile: products/kai-insight/Dockerfile
    container_name: kai-insight
    ports:
      - "8000:8000"
    environment:
      - KAI_PORT=8000
      - KAI_DAEMON_INTERVAL=60
      - KAI_SAVE_EVERY=5
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - kai_state:/app/.axiom_state
      - kai_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    networks:
      - kai-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: kai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - kai-network

  prometheus:
    image: prom/prometheus:latest
    container_name: kai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - kai-network

  grafana:
    image: grafana/grafana:latest
    container_name: kai-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - kai-network

  nginx:
    image: nginx:alpine
    container_name: kai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    restart: unless-stopped
    depends_on:
      - kai-insight
    networks:
      - kai-network

volumes:
  kai_state:
  kai_logs:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  kai-network:
    driver: bridge
