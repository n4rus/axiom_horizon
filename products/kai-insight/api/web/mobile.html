<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f14" />
<title>Kai Insight — Mobile</title>
<style>
  :root{
    --bg:#0b0f14; --card:#121821; --card2:#161e29; --line:#1f2a37;
    --fg:#e6edf3; --dim:#8b98a9; --acc:#39d0d8; --good:#3ddc84; --warn:#f5a623; --bad:#ff5d5d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 14px calc(14px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;background:linear-gradient(180deg,var(--bg),rgba(11,15,20,.85));
    backdrop-filter:blur(8px);padding:12px 0 8px;z-index:5;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 0 rgba(61,220,132,.5)}
  .dot.live{background:var(--good);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,.5)}70%{box-shadow:0 0 0 10px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
  .sub{font-size:12px;color:var(--dim);margin-top:2px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim)}
  .v{font-size:22px;font-weight:700;margin-top:2px}
  .v small{font-size:13px;font-weight:500;color:var(--dim)}
  .full{grid-column:1 / -1}
  .bar{height:8px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:8px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--good));width:0%}
  .search{margin:8px 0 14px}
  input[type=search]{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);
    background:var(--card2);color:var(--fg);font-size:16px}
  input[type=search]:focus{outline:none;border-color:var(--acc)}
  button{width:100%;padding:14px;border-radius:14px;border:0;background:var(--acc);color:#04212a;
    font-size:16px;font-weight:700;margin-top:8px}
  button:active{transform:scale(.99)}
  .results{display:flex;flex-direction:column;gap:10px}
  .res{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-decoration:none;color:var(--fg);display:block}
  .res h4{margin:0 0 4px;font-size:15px;color:var(--acc)}
  .res p{margin:0;font-size:13px;color:var(--dim)}
  .meta{font-size:12px;color:var(--dim);margin:6px 0;display:flex;justify-content:space-between}
  .note{font-size:11px;color:var(--dim);text-align:center;margin-top:16px}
  .note a{color:var(--acc);text-decoration:none}
  .err{color:var(--bad);font-size:13px;padding:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot" id="dot"></span> Kai Insight</div>
    <div class="sub" id="sub">connecting…</div>
  </header>

  <section class="grid">
    <div class="card"><div class="k">Mode</div><div class="v" id="m-mode">—</div></div>
    <div class="card"><div class="k">VFE</div><div class="v" id="m-vfe">—</div></div>
    <div class="card"><div class="k">Trend</div><div class="v" id="m-trend">—</div></div>
    <div class="card"><div class="k">Ricci</div><div class="v" id="m-ricci">—</div></div>
    <div class="card full">
      <div class="k">Health</div>
      <div class="v" id="m-health">—</div>
      <div class="bar"><i id="m-health-bar"></i></div>
    </div>
  </section>

  <section class="search">
    <input type="search" id="q" placeholder="Ask Kai the web…" enterkeyhint="search" />
    <button id="go">Search</button>
    <div class="err" id="err"></div>
    <div class="results" id="results"></div>
  </section>

  <div class="note">
    Open Core · <a href="/dashboard.html">full dashboard</a>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = (x,d=3)=> (x===null||x===undefined||isNaN(x)) ? '—' : Number(x).toFixed(d);

async function refresh(){
  try{
    const [s,h] = await Promise.all([
      fetch('/status').then(r=>r.json()),
      fetch('/health').then(r=>r.json()).catch(()=>({}))
    ]);
    const live = s.source === 'live_daemon';
    $('dot').className = 'dot' + (s.status==='running' ? ' live' : '');
    $('sub').textContent = (s.status==='running'?'online':'offline') +
      (s.source ? ' · '+s.source : '') + ' · ' + new Date().toLocaleTimeString();
    $('m-mode').textContent = s.mode || '—';
    $('m-vfe').textContent = fmt(s.vfe);
    const t = s.trend;
    $('m-trend').innerHTML = (t>0?'▲ ':t<0?'▼ ':'· ') + fmt(t,4);
    $('m-ricci').textContent = fmt(s.ricci);
    const score = h.health_score;
    if(score!==undefined){
      $('m-health').innerHTML = fmt(score,1)+'<small> /100</small>';
      $('m-health-bar').style.width = Math.max(0,Math.min(100,score))+'%';
    } else {
      $('m-health').textContent = '—';
    }
  }catch(e){
    $('dot').className='dot';
    $('sub').textContent='offline · '+e.message;
  }
}

async function search(){
  const q = $('q').value.trim();
  $('err').textContent=''; $('results').innerHTML='';
  if(!q){ return; }
  $('go').textContent='Searching…';
  try{
    const r = await fetch('/websearch',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({query:q, n:5})
    }).then(r=>r.json());
    $('go').textContent='Search';
    if(r.error){ $('err').textContent=r.error; return; }
    const items = r.results || [];
    if(!items.length){ $('err').textContent='No results (keyless Wikipedia fallback; provider may be rate-limited).'; return; }
    for(const it of items){
      const a=document.createElement('a'); a.className='res'; a.href=it.url||'#'; a.target='_blank';
      a.innerHTML = '<h4>'+ (it.title||'untitled') +'</h4><p>'+(it.snippet||'')+'</p>';
      $('results').appendChild(a);
    }
    const meta=document.createElement('div'); meta.className='meta';
    meta.innerHTML='<span>'+r.provider+'</span><span>'+(r.note||'')+'</span>';
    $('results').appendChild(meta);
  }catch(e){
    $('go').textContent='Search';
    $('err').textContent='Search failed: '+e.message;
  }
}

$('go').addEventListener('click', search);
$('q').addEventListener('keydown', e=>{ if(e.key==='Enter') search(); });
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
