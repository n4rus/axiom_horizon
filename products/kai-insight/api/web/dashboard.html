<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kai Insight — Live Dashboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
         background: #0d1117; color: #c9d1d9; }
  header { padding: 12px 16px; background: #161b22; border-bottom: 1px solid #30363d;
           display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; color: #58a6ff; }
  #status-dot { width: 10px; height: 10px; border-radius: 50%; background: #6e7681; }
  main { padding: 16px; display: grid; gap: 16px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; }
  .card .k { color: #8b949e; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .card .v { font-size: 20px; margin-top: 4px; }
  pre { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px;
        overflow: auto; max-height: 320px; margin: 0; }
  .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; }
  .panel h2 { margin: 0 0 8px; font-size: 13px; color: #8b949e; }
  input[type=text] { width: 100%; padding: 8px; background: #0d1117; border: 1px solid #30363d;
                     border-radius: 6px; color: #c9d1d9; }
  button { padding: 8px 12px; background: #238636; border: 0; border-radius: 6px;
           color: #fff; cursor: pointer; }
  button:hover { background: #2ea043; }
  .row { display: flex; gap: 8px; }
  .result { border-top: 1px solid #30363d; padding: 8px 0; }
  .result a { color: #58a6ff; text-decoration: none; }
  .result .snip { color: #8b949e; font-size: 12px; }
  .err { color: #f85149; }
</style>
</head>
<body>
<header>
  <span id="status-dot"></span>
  <h1>Kai Insight — Live Dashboard</h1>
  <span id="source" style="color:#8b949e"></span>
</header>
<main>
  <section class="cards" id="cards"></section>

  <section class="panel">
    <h2>Measurement detail (kai_metrics)</h2>
    <pre id="detail">loading…</pre>
  </section>

  <section class="panel">
    <h2>Web search — Kai's live web capacity</h2>
    <div class="row">
      <input type="text" id="q" placeholder="Ask Kai to search the web…" />
      <button id="go">Search</button>
    </div>
    <div id="results" style="margin-top:10px"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

async function refresh() {
  try {
    const s = await (await fetch('/status')).json();
    $('source').textContent = s.source || '';
    $('status-dot').style.background = (s.status === 'running') ? '#2ea043' : '#f85149';
    const cards = [
      ['Status', s.status],
      ['Mode', s.mode],
      ['VFE', s.vfe],
      ['Trend', s.trend],
      ['Ricci', s.ricci],
      ['w_cur', s.w_cur],
    ];
    $('cards').innerHTML = cards.map(([k,v]) =>
      `<div class="card"><div class="k">${k}</div><div class="v">${v ?? '—'}</div></div>`).join('');
  } catch (e) {
    $('status-dot').style.background = '#f85149';
  }
  try {
    const d = await (await fetch('/metrics/detail')).json();
    $('detail').textContent = JSON.stringify(d, null, 2);
  } catch (e) {}
}

async function search() {
  const q = $('q').value.trim();
  if (!q) return;
  $('results').innerHTML = '<div class="snip">searching…</div>';
  try {
    const r = await (await fetch('/websearch', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ query: q, n: 6 })
    })).json();
    if (r.error) { $('results').innerHTML = `<div class="err">error: ${r.error}</div>`; return; }
    if (!r.results || !r.results.length) {
      $('results').innerHTML = `<div class="snip">no results (provider=${r.provider}). Network may be unavailable.</div>`; return;
    }
    $('results').innerHTML = r.results.map(it =>
      `<div class="result"><a href="${it.url}" target="_blank" rel="noopener">${it.title}</a>` +
      `<div class="snip">${it.snippet}</div></div>`).join('');
  } catch (e) {
    $('results').innerHTML = `<div class="err">${e}</div>`;
  }
}

$('go').onclick = search;
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
