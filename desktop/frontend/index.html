<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kai</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="black">
<header>
  <button id="btn-menu" title="Menu">☰</button>
  <img src="assets/logo.png" alt="Kai" class="logo">
  <div><h1>Kai <span class="ver">v0.1</span></h1>
  <p class="sub" data-i18n="tagline">Private AI computer. No cloud. No subscription. No data leaves.</p></div>
</header>

<nav id="drawer" class="hidden">
  <button data-view="chat" data-i18n="nav_chat">Chat</button>
  <button data-view="history" data-i18n="nav_history">History</button>
  <button data-view="settings" data-i18n="nav_settings">Settings</button>
  <button data-view="about" data-i18n="nav_about">About</button>
</nav>

<section id="view-chat">
  <h2 data-i18n="status">Status</h2>
  <div class="cards">
    <div class="card">Ollama <b id="st-ollama">…</b><div class="small" id="st-models"></div></div>
    <div class="card">MCP :8000 <b id="st-mcp">…</b></div>
    <div class="card">Bridge :8765 <b id="st-bridge">…</b></div>
  </div>
  <div class="row">
    <button id="btn-mcp">Start MCP</button>
    <button id="btn-bridge">Start Bridge</button>
    <button id="btn-refresh" data-i18n="refresh">Refresh</button>
  </div>
  <div class="small" id="repo"></div>
  <h2 data-i18n="chat">Chat</h2>
  <div class="row">
    <select id="model"></select>
    <input id="prompt" type="text" size="60">
    <button id="btn-send" data-i18n="send">Send</button>
  </div>
  <div id="live"></div>
</section>

<section id="view-history" class="hidden">
  <h2 data-i18n="history">History</h2>
  <div class="row"><button id="btn-reload-history" data-i18n="reload">Reload</button></div>
  <div id="sessions"></div>
  <div id="messages"></div>
</section>

<section id="view-settings" class="hidden">
  <h2 data-i18n="settings">Settings</h2>
  <div class="row"><label data-i18n="theme">Background</label>
    <select id="sel-theme">
      <option value="black" data-i18n="theme_black">Black</option>
      <option value="white" data-i18n="theme_white">White</option>
    </select>
  </div>
  <div class="row"><label data-i18n="language">Language</label>
    <select id="sel-lang">
      <option value="en">English</option>
      <option value="pt">Português (Brasil)</option>
    </select>
  </div>
</section>

<section id="view-about" class="hidden">
  <h2 data-i18n="about">About</h2>
  <p data-i18n="about_text">Kai runs its engine, MCP server and Ollama models entirely on your machine.</p>
</section>

<script src="app.js"></script>
</body>
</html>
